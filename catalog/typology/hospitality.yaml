# Hotel / hospitality — guestroom FF&E, PTAC, commercial kitchen and laundry (PLAN.md §8d).
# Uniclass codes verified against the published Pr table.

- key: ptac_unit
  label: PTAC Unit
  ifc_class: IfcUnitaryEquipmentType
  predefined: AIRCONDITIONINGUNIT
  category: HVAC
  discipline: hospitality
  pack: typology-hospitality
  builder: box
  tier: L200
  classification: {uniclass: Pr_70_65_03}         # Air conditioning units
  material: {name: Steel Cabinet, category: steel}
  psets:
    MF_Hospitality: {Application: Guestroom}
  types:                                           # 42" x 16" wall sleeve is the industry standard
    - {name: 7000 BTU, dims: ['42"', '16"', '16"']}
    - {name: 9000 BTU, dims: ['42"', '16"', '16"']}
    - {name: 12000 BTU, dims: ['42"', '16"', '16"']}


# Industrial / warehouse — mezzanines, dock equipment, high-bay lighting, process services.
# Cranes, monorails and dock levelers live in catalog/conveying/conveying.yaml.
# Uniclass codes verified against the published Pr/Ss tables.

- key: highbay_light
  label: High-Bay Light
  ifc_class: IfcLightFixtureType
  predefined: DIRECTIONSOURCE
  category: Lighting
  discipline: industrial
  pack: typology-industrial
  builder: box
  tier: L200
  classification: {uniclass: Pr_70_70_48}         # Luminaires
  material: {name: Aluminium Housing, category: aluminium}
  psets:
    MF_Industrial: {MountingHeight: 25 ft}
  types:
    - {name: LED linear 4'-0", dims: ["4'-0\"", '12"', '6"']}
    - {name: LED round 24", dims: ['24"', '24"', '10"']}

- key: mezzanine
  label: Mezzanine Platform
  ifc_class: IfcSlabType
  predefined: FLOOR
  category: Platforms
  discipline: industrial
  pack: typology-industrial
  builder: box
  tier: L200
  classification: {uniclass: Ss_30_12}            # Floor and deck structure systems
  psets:
    Pset_SlabCommon: {LoadBearing: true, IsExternal: false}
  material:
    name: Steel Mezzanine Deck
    layers:
      - {material: Steel Bar Grating, thickness: '1 1/2"', category: steel}
  types:
    - {name: 20'-0" x 20'-0" bay, dims: ["20'-0\"", "20'-0\"", '1 1/2"']}
    - {name: 30'-0" x 30'-0" bay, dims: ["30'-0\"", "30'-0\"", '1 1/2"']}


# Residential — the content specific to dwellings.
#
# Appliances, casework, garage doors, furnaces and split systems live in the shared discipline packs;
# this file covers what only residential needs.
# Uniclass codes verified against the published Pr/Ss tables.

- key: closet_system
  label: Closet System
  ifc_class: IfcFurnitureType
  category: Storage
  discipline: residential
  pack: typology-residential
  builder: box
  tier: L200
  classification: {uniclass: Pr_40_30_87}         # Storage units and cupboards
  material: {name: Melamine Shelving, category: wood}
  types:
    - {name: Reach-in 6'-0", dims: ["6'-0\"", '24"', "7'-0\""]}
    - {name: Walk-in 8'-0", dims: ["8'-0\"", '24"', "7'-0\""]}
    - {name: Linen 30", dims: ['30"', '18"', "7'-0\""]}

- key: window_egress
  label: Egress Window
  ifc_class: IfcWindowType
  predefined: WINDOW
  category: Windows
  discipline: residential
  pack: typology-residential
  builder: box
  tier: L200
  classification: {uniclass: Pr_30_59_98}         # Window units
  material: {name: Vinyl Frame / IGU, category: plastic}
  psets:
    Pset_WindowCommon: {IsExternal: true}
    MF_Residential: {Code: IRC R310 emergency escape and rescue}
  types:                                           # IRC R310: 5.7 sq ft net clear, 24" h, 20" w min
    - {name: Casement 36" x 48", dims: ["3'-0\"", '3"', "4'-0\""]}
    - {name: Slider 48" x 36", dims: ["4'-0\"", '3"', "3'-0\""]}
    - {name: Double hung 36" x 60", dims: ["3'-0\"", '3"', "5'-0\""]}


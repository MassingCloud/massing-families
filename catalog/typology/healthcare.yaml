- key: partition_lead_lined
  label: Lead-Lined Partition
  ifc_class: IfcWallType
  predefined: PARTITIONING
  category: Walls
  discipline: healthcare
  pack: typology-healthcare
  builder: box
  tier: L200
  classification: {uniclass: Pr_25_71_35_99}      # X-ray-resistant gypsum plasterboards
  psets:
    Pset_WallCommon: {IsExternal: false, LoadBearing: false}
    MF_Healthcare: {LeadEquivalent: 1/16 in}
  material:
    name: Lead-Lined Partition
    layers:
      - {material: Lead-Lined Gypsum Board, thickness: '5/8"', category: gypsum}
      - {material: Steel Stud Cavity, thickness: '3 5/8"', category: steel}
      - {material: Lead-Lined Gypsum Board, thickness: '5/8"', category: gypsum}
  types:
    - {name: 1/16" lead 4 7/8", dims: ["8'-0\"", '4 7/8"', "10'-0\""]}
    - {name: 1/8" lead 4 7/8", dims: ["8'-0\"", '4 7/8"', "10'-0\""]}


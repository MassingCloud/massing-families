# Hospital / healthcare — the content no other typology needs (PLAN.md §8d).
# Uniclass codes verified against the published Pr/Ss tables.

- key: headwall
  label: Patient Headwall
  ifc_class: IfcMedicalDeviceType
  category: Patient Care
  discipline: healthcare
  pack: typology-healthcare
  builder: box
  tier: L200
  classification: {uniclass: Pr_40_50_06_38}      # Hospital bedheads
  material: {name: Solid Surface with Aluminium Raceway, category: composite}
  ports: {system: PIPE, names: [Oxygen, Vacuum, MedicalAir], flows: [SINK, SOURCE, SINK]}
  psets:
    MF_Healthcare: {Services: Oxygen / vacuum / medical air / power / nurse call}
  types:
    - {name: Single patient 60", dims: ["5'-0\"", '8"', "4'-0\""]}
    - {name: ICU 84", dims: ["7'-0\"", '10"', "5'-0\""]}

- key: medical_gas_outlet

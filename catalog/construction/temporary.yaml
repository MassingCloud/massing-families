# Construction operations / temporary works — the strategic differentiator (PLAN.md §8c).
#
# Revit and SketchUp handle temporary works poorly, and massing already has a GC portal with site
# logistics modules for this content to plug into. Nothing here is a permanent building element, so
# most map to IfcBuildingElementProxyType with a clear MF_Temporary pset.
#
# Uniclass Ss_15_95 (temporary works systems) codes verified against the published Ss table.

- key: scaffold_frame
  label: Frame Scaffold
  ifc_class: IfcBuildingElementProxyType
  predefined: USERDEFINED
  category: Access
  discipline: construction
  pack: construction-temporary
  builder: box
  tier: L200
  classification: {uniclass: Ss_15_95_35}         # Temporary fixed access systems
  material: {name: Galvanized Steel Frame, category: steel}
  psets:
    MF_Temporary: {Reusable: true, Discipline: Temporary works}
  types:                                           # 5'-0" x 7'-0" frame bay is the US standard
    - {name: 5'-0" x 7'-0" bay / 1 lift, dims: ["7'-0\"", "5'-0\"", "6'-6\""]}
    - {name: 5'-0" x 7'-0" bay / 3 lifts, dims: ["7'-0\"", "5'-0\"", "19'-6\""]}
    - {name: 5'-0" x 7'-0" bay / 6 lifts, dims: ["7'-0\"", "5'-0\"", "39'-0\""]}


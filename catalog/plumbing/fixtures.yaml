- key: water_heater
  label: Water Heater
  massing_key: water_heater
  ifc_class: IfcSanitaryTerminalType
  category: Equipment
  discipline: plumbing
  pack: plumbing-fixtures
  builder: revolve
  tier: L300
  classification: {uniclass: Pr_60_60_96}         # Water heaters
  material: {name: Glass-lined Steel, category: steel}
  ports: {system: PIPE, names: [ColdIn, HotOut], flows: [SINK, SOURCE]}
  psets:
    MF_Equipment: {FuelType: Electric}
  types:                                           # revolved tank body — genuinely round
    - name: 40 gal (20" dia)
      dims: ['20"', '20"', "5'-0\""]
      revolve: {profile: {kind: Rectangle, params: {XDim: '10"', YDim: "5'-0\""}},
                angle: 360, axis_offset: '10"'}
    - name: 50 gal (22" dia)
      dims: ['22"', '22"', "5'-0\""]
      revolve: {profile: {kind: Rectangle, params: {XDim: '11"', YDim: "5'-0\""}},
                angle: 360, axis_offset: '11"'}
    - name: 80 gal (26" dia)
      dims: ['26"', '26"', "5'-10\""]
      revolve: {profile: {kind: Rectangle, params: {XDim: '13"', YDim: "5'-10\""}},
                angle: 360, axis_offset: '13"'}

# Plumbing fixtures — US imperial nominal sizes.
# Uniclass codes verified against the published Pr table.

- key: toilet
  label: Water Closet
  massing_key: toilet
  ifc_class: IfcSanitaryTerminalType
  predefined: WCSEAT
  category: Sanitary
  discipline: plumbing
  classification: {uniclass: Pr_40_20_93_94}          # WC pans
  pack: plumbing-fixtures
  builder: box
  tier: L200
  material: {name: Vitreous China, category: ceramic}
  ports: {system: PIPE, names: [Supply, Waste], flows: [SINK, SOURCE]}
  psets:
    MF_Plumbing: {FlushType: Flush Valve, DrainageFixtureUnits: "4", SupplyFixtureUnits: "10"}
  types:
    - {name: 'Floor-Mounted 1.28 GPF', dims: ['1''-2"', '2''-4"', '2''-6"']}
    - {name: 'Wall-Hung 1.28 GPF', dims: ['1''-2"', '2''-2"', '1''-3"']}
    - {name: 'Floor-Mounted ADA 1.28 GPF', dims: ['1''-2"', '2''-6"', '2''-8"']}


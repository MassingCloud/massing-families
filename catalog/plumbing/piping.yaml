# Plumbing piping — nominal trade sizes with distribution ports.
#
# Outside diameters and wall thicknesses are published nominal values:
#   Copper  — ASTM B88 Type L (OD = nominal + 1/8")
#   PVC/CPVC— Schedule 40, IPS outside diameters (ASME B36.10 series)
#   Steel   — see catalog/structural/steel.yaml; AISC PIPE data is ASME B36.10 and is reused for
#             fire-protection piping rather than re-keyed here
#
# Cast iron below is CISPI 301 no-hub nominal and is the least-verified table in this file; treat as
# L300-nominal rather than fabrication-accurate until checked against a current CISPI table.

- key: pipe_copper_l
  label: Copper Pipe Type L
  ifc_class: IfcPipeSegmentType
  predefined: RIGIDSEGMENT
  category: Domestic Water
  discipline: plumbing
  classification: {uniclass: Pr_65_52_63}             # Pipes and fittings
  pack: plumbing-piping
  builder: profile
  tier: L300
  material: {name: Copper, category: copper}
  ports: {system: PIPE, names: [In, Out], flows: [SINK, SOURCE]}
  psets:
    MF_Piping: {Standard: ASTM B88, Type: L, Service: Domestic Water}
  generator: sizes
  generator_args:
    kind: CircleHollow
    length: "20'-0\""
    name: '{nominal} Copper Type L'
    entries:
      - {nominal: '1/2"', od: 0.625, wall: 0.040}
      - {nominal: '3/4"', od: 0.875, wall: 0.045}
      - {nominal: '1"', od: 1.125, wall: 0.050}
      - {nominal: '1-1/4"', od: 1.375, wall: 0.055}
      - {nominal: '1-1/2"', od: 1.625, wall: 0.060}
      - {nominal: '2"', od: 2.125, wall: 0.070}
      - {nominal: '2-1/2"', od: 2.625, wall: 0.080}
      - {nominal: '3"', od: 3.125, wall: 0.090}
      - {nominal: '4"', od: 4.125, wall: 0.110}


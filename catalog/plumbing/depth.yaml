# Plumbing depth — enough content to actually plumb a building (FAMILY-COMPLETE batch 1).
#
# The base plumbing catalog carried 16 families / 20 types: one of each system, which proves a
# typology *can* be plumbed but cannot model a real one. This adds the size series and the fixture
# breadth a working project needs.
#
# Pipe uses real trade data: copper Type L (ASTM B88) and Schedule 40 PVC (ASTM D1785) outside
# diameters and wall thicknesses; DWV cast iron is no-hub (ASTM A888) service-weight OD.
# Fixtures are massing-grade boxes at code-real dimensions — a fixture's value in a model is its
# footprint, clearance and connection point, not its porcelain profile.

# ─────────────────────────── supply piping ───────────────────────────

# NOTE: cleanout, floor_drain, lavatory, pipe_pvc_sch40, roof_drain and water_heater are
# deliberately NOT here — the base catalog already carries each at equivalent depth. Adding
# them would fork one system across two families, which is worse than a thinner catalog.

- key: sink_service
  label: Service / Mop Sink
  ifc_class: IfcSanitaryTerminalType
  predefined: SINK
  category: Sanitary
  discipline: plumbing
  classification: {uniclass: Pr_40_20_96}             # Washbasins
  pack: plumbing-fixtures
  builder: box
  tier: L200
  material: {name: Molded Stone, category: composite}
  ports: {system: PIPE, names: [Hot, Cold, Waste], flows: [SINK, SINK, SOURCE]}
  psets:
    MF_Plumbing: {DrainageFixtureUnits: "3"}
  types:
    - {name: 'Floor Mop Basin 24" x 24"', dims: ['2''-0"', '2''-0"', '0''-10"']}
    - {name: 'Wall Service Sink 22" x 18"', dims: ['1''-10"', '1''-6"', '1''-0"']}
- key: drinking_fountain
  label: Drinking Fountain / Bottle Filler
  ifc_class: IfcSanitaryTerminalType
  predefined: NOTDEFINED
  category: Sanitary
  discipline: plumbing
  classification: {uniclass: Pr_40_70_15_24}          # Drinking fountains
  pack: plumbing-fixtures
  builder: box
  tier: L200
  material: {name: Stainless Steel, category: metal}
  ports: {system: PIPE, names: [Cold, Waste], flows: [SINK, SOURCE]}
  psets:
    MF_Plumbing: {DrainageFixtureUnits: "0.5", ADACompliant: "true"}
  types:
    - {name: 'Bi-Level ADA', dims: ['1''-6"', '1''-4"', '3''-4"']}
    - {name: 'Bi-Level with Bottle Filler', dims: ['1''-6"', '1''-4"', '4''-6"']}


# Plumbing depth — enough content to actually plumb a building (FAMILY-COMPLETE batch 1).
#
# The base plumbing catalog carried 16 families / 20 types: one of each system, which proves a
# typology *can* be plumbed but cannot model a real one. This adds the size series and the fixture
# breadth a working project needs.
#
# Pipe uses real trade data: copper Type L (ASTM B88) and Schedule 40 PVC (ASTM D1785) outside
# diameters and wall thicknesses; DWV cast iron is no-hub (ASTM A888) service-weight OD.
# Fixtures are massing-grade boxes at code-real dimensions — a fixture's value in a model is its
# footprint, clearance and connection point, not its porcelain profile.

# ─────────────────────────── supply piping ───────────────────────────

# NOTE: cleanout, floor_drain, lavatory, pipe_pvc_sch40, roof_drain and water_heater are
# deliberately NOT here — the base catalog already carries each at equivalent depth. Adding
# them would fork one system across two families, which is worse than a thinner catalog.

- key: pipe_copper_type_l
  label: Copper Pipe (Type L)
  ifc_class: IfcPipeSegmentType
  predefined: RIGIDSEGMENT
  category: Domestic Water
  discipline: plumbing
  classification: {uniclass: Pr_65_52_63}             # Pipes and fittings
  pack: plumbing-piping
  builder: profile
  tier: L300
  material: {name: Copper, category: copper}
  ports: {system: PIPE, names: [In, Out], flows: [SINK, SOURCE]}
  psets:
    MF_Piping: {Standard: ASTM B88, Type: L, Service: Domestic Water}
  generator: sizes
  generator_args:
    kind: CircleHollow
    length: "20'-0\""
    name: '{nominal} Copper Type L'
    entries:
      - {nominal: '1/2"', od: 0.625, wall: 0.040}
      - {nominal: '3/4"', od: 0.875, wall: 0.045}
      - {nominal: '1"', od: 1.125, wall: 0.050}
      - {nominal: '1-1/4"', od: 1.375, wall: 0.055}
      - {nominal: '1-1/2"', od: 1.625, wall: 0.060}
      - {nominal: '2"', od: 2.125, wall: 0.070}
      - {nominal: '2-1/2"', od: 2.625, wall: 0.080}
      - {nominal: '3"', od: 3.125, wall: 0.090}
      - {nominal: '4"', od: 4.125, wall: 0.110}
- key: pipe_cast_iron_nohub
  label: Cast Iron Pipe (No-Hub, DWV)
  ifc_class: IfcPipeSegmentType
  predefined: RIGIDSEGMENT
  category: Drainage
  discipline: plumbing
  classification: {uniclass: Pr_65_52_03}             # Above-ground drainage pipes and fittings
  pack: plumbing-piping
  builder: profile
  tier: L300
  material: {name: Cast Iron, category: metal}
  ports: {system: PIPE, names: [In, Out], flows: [SINK, SOURCE]}
  psets:
    MF_Piping: {Standard: ASTM A888, Service: Sanitary Drainage, Weight: Service}
  generator: sizes
  generator_args:
    kind: CircleHollow
    length: "10'-0\""
    name: '{nominal} CI No-Hub'
    entries:
      - {nominal: '2"', od: 2.35, wall: 0.16}
      - {nominal: '3"', od: 3.35, wall: 0.17}
      - {nominal: '4"', od: 4.38, wall: 0.19}
      - {nominal: '6"', od: 6.44, wall: 0.22}
      - {nominal: '8"', od: 8.48, wall: 0.25}


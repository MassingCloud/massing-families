# Electrical raceway — conduit, cable tray and busway at NEC trade sizes, with distribution ports.
#
# Conduit outside diameters follow ANSI C80.3 (EMT) and C80.1 (RMC) published trade-size dimensions.
# Cable tray widths/depths follow NEMA VE-1 standard ladder tray.

- key: conduit_emt
  label: EMT Conduit
  ifc_class: IfcCableCarrierSegmentType
  predefined: CONDUITSEGMENT
  category: Raceway
  discipline: electrical
  pack: electrical-raceway
  builder: profile
  tier: L300
  classification: {uniclass: Pr_65_70_11}
  material: {name: Galvanized Steel EMT, category: steel}
  ports: {system: CABLECARRIER}
  generator: sizes
  generator_args:
    kind: CircleHollow
    length: "10'-0\""
    name: '{nominal}" EMT'
    entries:
      - {nominal: '1/2', od: 0.706, wall: 0.042}
      - {nominal: '3/4', od: 0.922, wall: 0.049}
      - {nominal: '1', od: 1.163, wall: 0.057}
      - {nominal: '1-1/4', od: 1.510, wall: 0.065}
      - {nominal: '1-1/2', od: 1.740, wall: 0.065}
      - {nominal: '2', od: 2.197, wall: 0.065}
      - {nominal: '2-1/2', od: 2.875, wall: 0.072}
      - {nominal: '3', od: 3.500, wall: 0.072}
      - {nominal: '4', od: 4.500, wall: 0.083}


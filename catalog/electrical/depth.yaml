# Electrical depth — enough content to actually power and light a building (FAMILY-COMPLETE batch 2).
#
# The base electrical catalog carried 15 families / 32 types. Its ROUTING content was already
# reasonable (EMT and RMC conduit series, ladder tray, busway), so this fills the two real gaps:
#
#   * Luminaires — four families / eight types cannot light a project. A lighting model needs the
#     linear, high-bay, wall-pack, strip, track and — critically — the EGRESS families, because exit
#     signage and emergency lighting are code-required in every one of the six target typologies.
#   * Distribution + devices — the gear between the service and the outlet: MCCs, safety switches,
#     transfer switches, metering, UPS, plus data outlets, floor boxes, dimmers and sensors.
#
# Lamp wattages and lumen outputs are LED-typical values carried as psets so a lighting-power-density
# check has something to read; they are stated defaults, not manufacturer data.


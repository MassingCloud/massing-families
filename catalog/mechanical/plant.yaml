# Central plant and terminal units — the equipment a building cannot run without.
#
# This closes a real gap: the catalog had air handlers and fan coils but no heat source, no cooling
# source, no pumps and no VAV boxes, so no complete HVAC system could be modelled.
# Uniclass codes verified against the published Pr table.

- key: chiller
  label: Chiller
  ifc_class: IfcChillerType
  predefined: WATERCOOLED
  category: Central Plant
  discipline: mechanical
  pack: mechanical-plant
  builder: box
  tier: L200
  classification: {uniclass: Pr_60_60_13}         # Chillers and cooling towers
  material: {name: Painted Steel Frame, category: steel}
  ports: {system: PIPE, names: [ChilledWaterSupply, ChilledWaterReturn, CondenserSupply, CondenserReturn],
          flows: [SOURCE, SINK, SINK, SOURCE]}
  psets:
    MF_Equipment: {ServiceAccessClearance: "3'-0\""}
  types:
    - {name: 100 ton water-cooled, dims: ["12'-0\"", "4'-0\"", "6'-0\""]}
    - {name: 300 ton water-cooled, dims: ["16'-0\"", "5'-0\"", "7'-0\""]}
    - {name: 600 ton centrifugal, dims: ["22'-0\"", "7'-0\"", "8'-0\""]}
    - {name: 60 ton air-cooled, dims: ["14'-0\"", "7'-0\"", "7'-0\""]}


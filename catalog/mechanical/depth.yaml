# Mechanical depth — the parts between the equipment and the diffuser (FAMILY-COMPLETE batch 4).
#
# The base mechanical catalog is the strongest of the MEP three: 26 families covering air handlers,
# chillers, boilers, towers, fans, terminals and round/rect duct. What it lacks is everything that
# makes a duct run BUILDABLE — rect fittings (it has round elbows and tees only), transitions,
# dampers, and the accessories that occupy the plenum a coordinator has to clear. It also has no
# hydronic specialties, so a chilled-water plant can be placed but not piped.
#
# Typology drivers: hospitals need air-side isolation and humidity (isolation damper, humidifier,
# HEPA terminal); airports and industrial need large-scale makeup air and destratification;
# hotels/residential need through-wall and VRF equipment the base list has no room for.


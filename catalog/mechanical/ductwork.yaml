# Ductwork — SMACNA standard round and rectangular sizes, with distribution ports.
#
# Ports verified to survive massing's import (PLAN.md §8f spike): they attach to the type via
# IfcRelNests and arrive with FlowDirection intact, so port-to-port routing works on imported content.
#
# Round duct is modelled as CircleHollow at sheet-metal gauge; rectangular as RectangleHollow.
# Gauges follow SMACNA duct construction standards for the pressure class.

- key: duct_round
  label: Round Duct
  ifc_class: IfcDuctSegmentType
  predefined: RIGIDSEGMENT
  category: Ductwork
  discipline: mechanical
  pack: mechanical-ductwork
  builder: profile
  tier: L300
  classification: {uniclass: Pr_65_65_25}
  material: {name: Galvanized Steel, category: steel}
  ports: {system: DUCT}
  generator: sizes
  generator_args:
    kind: CircleHollow
    length: "10'-0\""
    wall: 0.028                                  # 24 ga
    name: '{nominal}" Round'
    entries:
      - {nominal: 4, od: 4}
      - {nominal: 5, od: 5}
      - {nominal: 6, od: 6}
      - {nominal: 7, od: 7}
      - {nominal: 8, od: 8}
      - {nominal: 9, od: 9}
      - {nominal: 10, od: 10}
      - {nominal: 12, od: 12}
      - {nominal: 14, od: 14}
      - {nominal: 16, od: 16}
      - {nominal: 18, od: 18}
      - {nominal: 20, od: 20}
      - {nominal: 22, od: 22}
      - {nominal: 24, od: 24}
      - {nominal: 26, od: 26}
      - {nominal: 28, od: 28}
      - {nominal: 30, od: 30}
      - {nominal: 32, od: 32}
      - {nominal: 36, od: 36}
      - {nominal: 42, od: 42}
      - {nominal: 48, od: 48}


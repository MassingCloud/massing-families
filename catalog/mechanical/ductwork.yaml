- key: duct_reducer
  label: Round Duct Reducer
  ifc_class: IfcDuctFittingType
  predefined: TRANSITION
  category: Duct Fittings
  discipline: mechanical
  pack: mechanical-ductwork
  builder: taper
  tier: L300
  classification: {uniclass: Pr_65_65_25}
  material: {name: Galvanized Steel, category: steel}
  ports: {system: DUCT}
  types:                                           # real tapered transition, not a straight tube
    - {name: 10" to 8", dims: ['10"', '10"', '12"'],
       taper: {start: {kind: Circle, params: {Radius: '5"'}},
               end: {kind: Circle, params: {Radius: '4"'}}, depth: '12"'}}
    - {name: 12" to 10", dims: ['12"', '12"', '12"'],
       taper: {start: {kind: Circle, params: {Radius: '6"'}},
               end: {kind: Circle, params: {Radius: '5"'}}, depth: '12"'}}
    - {name: 14" to 12", dims: ['14"', '14"', '12"'],
       taper: {start: {kind: Circle, params: {Radius: '7"'}},
               end: {kind: Circle, params: {Radius: '6"'}}, depth: '12"'}}
    - {name: 16" to 12", dims: ['16"', '16"', '18"'],
       taper: {start: {kind: Circle, params: {Radius: '8"'}},
               end: {kind: Circle, params: {Radius: '6"'}}, depth: '18"'}}
    - {name: 20" to 16", dims: ['20"', '20"', '18"'],
       taper: {start: {kind: Circle, params: {Radius: '10"'}},
               end: {kind: Circle, params: {Radius: '8"'}}, depth: '18"'}}
    - {name: 24" to 20", dims: ['24"', '24"', '24"'],
       taper: {start: {kind: Circle, params: {Radius: '12"'}},
               end: {kind: Circle, params: {Radius: '10"'}}, depth: '24"'}}

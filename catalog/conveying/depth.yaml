# Conveying depth — the shaft, not just the cab (FAMILY-COMPLETE batch 6a).
#
# The base conveying catalog places a cab, an escalator and a moving walk. What it cannot model is
# the SHAFT — and the shaft is what an architect coordinates: pit depth, overhead, machine room or
# machine-room-less, hoistway doors on every level, and the counterweight rail line that a structural
# wall has to miss. A traction elevator with a 4'-0" pit and a hydraulic with a 4'-0" pit are the
# same drawing; a hydraulic needs a jack hole below it and the traction needs 15'-0" of overhead.
#
# Also here: the vertical transport the six typologies need and the base list omits — freight and
# service cars (hotel/hospital/industrial), and the pneumatic tube that carries hospital specimens.

- key: elevator_traction
  label: Traction Elevator (Machine-Room-Less)
  ifc_class: IfcTransportElementType
  predefined: ELEVATOR
  category: Elevators
  discipline: conveying
  classification: {uniclass: Pr_65_80_49}           # Lift products and components
  pack: conveying-elevators
  builder: box
  tier: L200
  material: {name: Stainless Steel, category: metal}
  psets:
    MF_Conveying: {Drive: Gearless Traction, MachineRoom: None (MRL),
                   PitDepth: "5'-0\"", Overhead: "15'-0\"", Standard: ASME A17.1}
  types:
    - {name: '2500 lb — 8''x8'' Hoistway', dims: ['8''-0"', '8''-0"', '10''-0"']}
    - {name: '3500 lb — 9''x9'' Hoistway', dims: ['9''-0"', '9''-0"', '10''-0"']}
    - {name: '4500 lb — 9''x10'' Hoistway', dims: ['9''-0"', '10''-0"', '10''-0"']}


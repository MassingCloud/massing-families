# Conveying — escalators, moving walks, cranes, hoists, dock equipment, baggage handling.
# Uniclass codes verified against the published Pr table.

- key: escalator
  label: Escalator
  ifc_class: IfcTransportElementType
  predefined: ESCALATOR
  category: Conveying
  discipline: conveying
  builder: box
  tier: L200
  classification: {uniclass: Pr_65_80_28_21}      # Escalators
  material: {name: Stainless Steel / Glass Balustrade, category: steel}
  psets:
    MF_Conveying: {NominalSpeed: 100 fpm, Incline: 30 deg}
  types:                                           # 32"/40"/48" nominal step widths
    - {name: 32" step / 12'-0" rise, dims: ["4'-0\"", "35'-0\"", "12'-0\""]}
    - {name: 40" step / 12'-0" rise, dims: ["4'-8\"", "35'-0\"", "12'-0\""]}
    - {name: 40" step / 18'-0" rise, dims: ["4'-8\"", "48'-0\"", "18'-0\""]}


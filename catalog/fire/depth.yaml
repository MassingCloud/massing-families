# Fire protection depth — a code-complete fire system (FAMILY-COMPLETE batch 3).
#
# The base fire catalog carried 13 families / 14 types: sprinkler heads, pipe, a pump, an FDC, a
# damper and a detector. That is the skeleton of NFPA 13/14/72 with none of the parts that make a
# system inspectable — no riser valve trim, no hose stations, no alarm panel, no notification.
#
# Everything here is code-driven rather than decorative: an FACP and notification appliances are
# required wherever detection is, a dry system is the only way to sprinkler an unheated space
# (parking, loading dock — industrial and airport cannot be modelled without one), and smoke dampers
# are distinct from fire dampers because they are a different listing on a different system.

# ─────────────────────────── riser + valve trim ───────────────────────────
- key: sprinkler_control_valve
  label: Sprinkler Control Valve (OS&Y)
  ifc_class: IfcValveType
  predefined: ISOLATING
  category: Sprinkler Piping
  discipline: fire
  classification: {uniclass: Pr_65_54_30}           # Firefighting valves and devices
  pack: fire-sprinkler
  builder: box
  tier: L200
  material: {name: Cast Iron / Bronze, category: metal}
  ports: {system: PIPE, names: [In, Out], flows: [SINK, SOURCE]}
  psets:
    MF_FireProtection: {Supervised: "true", Standard: NFPA 13}
  types:
    - {name: '4" OS&Y Gate', dims: ['1''-6"', '0''-10"', '2''-0"']}
    - {name: '6" OS&Y Gate', dims: ['1''-10"', '1''-0"', '2''-6"']}

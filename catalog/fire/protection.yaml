# Fire protection and fire sprinkler — NFPA 13 / 14 / 72 content.
#
# Sprinkler pipe uses Schedule 40 IPS outside diameters (ASME B36.10), the same series as the AISC
# PIPE table already derived for structural. ESFR heads are included because industrial and warehouse
# typologies cannot be sprinklered without them (PLAN.md §8d).

- key: sprinkler_pendent
  label: Sprinkler Head (Pendent)
  ifc_class: IfcFireSuppressionTerminalType
  predefined: SPRINKLER
  category: Sprinkler
  discipline: fire
  pack: fire-sprinkler
  builder: profile
  tier: L300
  classification: {uniclass: Pr_70_55_97_84}
  material: {name: Bronze / Glass Bulb, category: bronze}
  ports: {system: PIPE, names: [In], flows: [SOURCE]}
  psets:
    MF_FireProtection: {ResponseType: Quick, Orientation: Pendent}
  generator: sizes
  generator_args:
    kind: Circle
    length: '3"'
    name: '{nominal} K-factor Pendent'
    entries:
      - {nominal: 'K5.6', od: 2.0}
      - {nominal: 'K8.0', od: 2.25}
      - {nominal: 'K11.2', od: 2.5}


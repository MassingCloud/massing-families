# Stairs, ramps, railings and guards — IBC / ADA compliant dimensions.
#
# Riser/tread and ramp slopes follow IBC 1011 (stairways), 1012 (ramps) and ADA 405: max 7" riser,
# min 11" tread, ramps max 1:12 with 5'-0" landings.
# Uniclass codes verified against the published Pr/Ss tables.

- key: stair_steel_pan
  label: Steel Pan Stair
  ifc_class: IfcStairType
  predefined: STRAIGHT_RUN_STAIR
  category: Stairs
  discipline: architectural
  pack: architectural-circulation
  builder: box
  tier: L200
  classification: {uniclass: Ss_35_10}            # Stair and ramp structure systems
  material: {name: Steel Pan with Concrete Fill, category: steel}
  psets:
    Pset_StairCommon: {NumberOfRiser: 18, NumberOfTreads: 17, RiserHeight: 7, TreadLength: 11,
                       RequiredHeadroom: 80, FireExit: true}
  types:
    - {name: 3'-8" wide egress, dims: ["3'-8\"", "16'-0\"", "10'-6\""]}
    - {name: 4'-0" wide egress, dims: ["4'-0\"", "16'-0\"", "10'-6\""]}
    - {name: 5'-0" wide egress, dims: ["5'-0\"", "16'-0\"", "10'-6\""]}

- key: stair_concrete
  label: Concrete Stair
  ifc_class: IfcStairType
  predefined: STRAIGHT_RUN_STAIR
  category: Stairs
  discipline: architectural
  pack: architectural-circulation
  builder: box
  tier: L200
  classification: {uniclass: Ss_35_10}            # Stair and ramp structure systems
  material: {name: Cast-in-Place Concrete, category: concrete}
  psets:
    Pset_StairCommon: {RiserHeight: 7, TreadLength: 11, FireExit: true}
  types:
    - {name: 4'-0" wide, dims: ["4'-0\"", "16'-0\"", "10'-6\""]}
    - {name: 5'-0" wide, dims: ["5'-0\"", "16'-0\"", "10'-6\""]}


# Architectural specialties — toilet partitions, lockers, signage, casework, shading.
# Uniclass codes verified against the published Pr/Ss tables.

- key: toilet_partition
  label: Toilet Partition
  ifc_class: IfcBuildingElementProxyType
  predefined: USERDEFINED
  category: Specialties
  discipline: architectural
  pack: architectural-specialties
  builder: box
  tier: L200
  classification: {uniclass: Ss_25_12_60_60}      # Panel cubicle systems
  material: {name: Solid Phenolic Core, category: composite}
  psets:
    MF_Specialty: {MountingType: Floor-mounted overhead-braced}
  types:                                           # ADA stall is 60" x 60" clear
    - {name: Standard 36" x 60", dims: ["3'-0\"", "5'-0\"", "6'-0\""]}
    - {name: ADA 60" x 60", dims: ["5'-0\"", "5'-0\"", "6'-0\""]}
    - {name: Urinal screen 24", dims: ['24"', '2"', "4'-0\""]}


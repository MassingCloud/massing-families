- key: door_vision_panel
  label: Door with Vision Panel
  ifc_class: IfcDoorType
  predefined: DOOR
  category: Doors
  discipline: architectural
  pack: architectural-specialties
  builder: boolean
  tier: L300
  classification: {uniclass: Pr_30_59_24}         # Doorsets
  material: {name: Solid Core with Tempered Glazing, category: composite}
  psets:
    Pset_DoorCommon: {IsExternal: false, Reference: Flush leaf with vision lite}
  types:                                          # the leaf is actually cut, not just labelled
    - name: 3'-0" x 7'-0" narrow lite
      dims: ["3'-0\"", '1 3/4"', "7'-0\""]
      boolean:
        base: {kind: Rectangle, params: {XDim: "3'-0\"", YDim: '1 3/4"'}, depth: "7'-0\""}
        voids:
          - {kind: Rectangle, params: {XDim: '5"', YDim: '6"'}, depth: '24"',
             at: ['8"', 0, "4'-6\""], name: Vision lite}
    - name: 3'-0" x 7'-0" half lite
      dims: ["3'-0\"", '1 3/4"', "7'-0\""]
      boolean:
        base: {kind: Rectangle, params: {XDim: "3'-0\"", YDim: '1 3/4"'}, depth: "7'-0\""}
        voids:
          - {kind: Rectangle, params: {XDim: '20"', YDim: '6"'}, depth: '30"',
             at: [0, 0, "4'-0\""], name: Vision lite}
    - name: 3'-6" x 7'-0" wide lite
      dims: ["3'-6\"", '1 3/4"', "7'-0\""]
      boolean:
        base: {kind: Rectangle, params: {XDim: "3'-6\"", YDim: '1 3/4"'}, depth: "7'-0\""}
        voids:
          - {kind: Rectangle, params: {XDim: '24"', YDim: '6"'}, depth: '36"',
             at: [0, 0, "3'-9\""], name: Vision lite}

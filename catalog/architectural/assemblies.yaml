- key: roof_low_slope
  label: Low-Slope Roof Assembly
  ifc_class: IfcRoofType
  predefined: FLAT_ROOF
  category: Roofs
  discipline: architectural
  pack: architectural-assemblies
  builder: box
  tier: L200
  classification: {uniclass: Ss_30_10}            # Roof structure systems
  psets:
    Pset_RoofCommon: {IsExternal: true, ThermalTransmittance: 0.032}
  material:
    name: TPO Roof over Rigid Insulation
    layers:
      - {material: TPO Membrane, thickness: '1/16"', category: plastic}
      - {material: Cover Board, thickness: '1/2"', category: gypsum}

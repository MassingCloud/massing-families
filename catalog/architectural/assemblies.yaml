# Floor, roof and ceiling assemblies — the "assembly types for authored elements" gap (PLAN.md §8b.2).
#
# The user draws the geometry in massing; the library supplies the *assembly definition*. The value is
# the material layer set — it drives schedules, thermal calcs and takeoff. massing's built-ins carry a
# single unnamed slab with no layers at all.
#
# Uniclass Ss (systems) codes, verified against the published Ss table.

- key: floor_slab_concrete
  label: Concrete Floor Slab
  ifc_class: IfcSlabType
  predefined: FLOOR
  category: Floors
  discipline: architectural
  pack: architectural-assemblies
  builder: box
  tier: L200
  classification: {uniclass: Ss_30_12}            # Floor and deck structure systems
  psets:
    Pset_SlabCommon: {IsExternal: false, LoadBearing: true, FireRating: 2 hr}
  material:
    name: Cast-in-Place Concrete Slab
    layers:
      - {material: 4000 psi Normal Weight Concrete, thickness: '6"', category: concrete}
  types:
    - {name: 4" slab on grade, dims: ["10'-0\"", "10'-0\"", '4"']}
    - {name: 5" slab on grade, dims: ["10'-0\"", "10'-0\"", '5"']}
    - {name: 6" suspended slab, dims: ["10'-0\"", "10'-0\"", '6"']}
    - {name: 8" suspended slab, dims: ["10'-0\"", "10'-0\"", '8"']}
    - {name: 10" post-tensioned, dims: ["10'-0\"", "10'-0\"", '10"']}


# Architectural depth — the openings, assemblies and specialties a real building needs
# (FAMILY-COMPLETE batch 5a).
#
# Architectural was already the broadest discipline (59 families), so this is a gap-fill rather than
# a rebuild. The gaps are typology-shaped: the base catalog can build an office and a warehouse, but
# not a hospital (no lead-lined or acoustic door, no crash rail, no cleanroom ceiling), a hotel (no
# sliding/pocket door, no connecting-room pair), or an airport (no automatic sliding entrance, no
# monumental stair, no interior glazed partition at scale).
#
# Wall types are the other structural gap: the base list has CMU, concrete, a generic exterior and a
# generic partition. A real envelope section needs the veneer, the panel, the furring and the barrier
# as separate elements, because they are separate trades with separate schedules.


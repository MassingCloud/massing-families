# Structural steel — every standard AISC mill shape, generated as a real parametric profile.
#
# Section dimensions are DERIVED from the AISC Shapes Database v15.0 (US customary) via
# `tools/derive_aisc.py` into `data/aisc_shapes.csv`. We ship derived dimensional values, never the
# source spreadsheet (PLAN.md §8g tier 2) — dimensions of standard mill shapes are facts, not creative
# work. This replaces the hand-transcribed literals that were previously flagged here; all eight of
# them were verified correct against the database before removal.
#
# Packs are split by trade rather than lumped into one "structural" file, because massing's import
# pulls in *every* type in a file (PLAN.md §3) — a single 1,400-type steel pack would flood a project.

# ── Wide flange and bearing pile ──────────────────────────────────────────────
- key: steel_column_w
  label: W-Shape Column
  massing_key: steel_column
  ifc_class: IfcColumnType
  predefined: COLUMN
  category: Columns
  discipline: structural
  pack: structural-steel-w
  builder: profile
  tier: L300
  classification: {uniclass: Pr_20_76_51_92}      # Universal column sections
  material: {name: ASTM A992 Steel, category: steel}
  psets:
    Pset_ColumnCommon: {LoadBearing: true, IsExternal: false}
  generator: aisc
  generator_args: {family: W, series: [W8, W10, W12, W14], length: "12'-0\""}

- key: steel_beam_w
  label: W-Shape Beam
  massing_key: steel_beam
  ifc_class: IfcBeamType
  predefined: BEAM
  category: Beams
  discipline: structural
  pack: structural-steel-w
  builder: profile
  tier: L300

  material: {name: ASTM A992 Steel, category: steel}
  psets:
    Pset_BeamCommon: {LoadBearing: true, IsExternal: false}
  generator: aisc
  generator_args: {family: W, length: "30'-0\""}

- key: steel_pile_hp

       profile: {params: {XDim: "8'-0\"", YDim: '6.875"'}}}
    - {name: 7-ply 9 5/8", dims: ["8'-0\"", '9.625"', "40'-0\""],
       profile: {params: {XDim: "8'-0\"", YDim: '9.625"'}}}


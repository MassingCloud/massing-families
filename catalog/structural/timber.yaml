       profile: {params: {XDim: '5.125"', YDim: '18"'}}}
    - {name: 6 3/4" x 24", dims: ['6.75"', '24"', "40'-0\""],
       profile: {params: {XDim: '6.75"', YDim: '24"'}}}
    - {name: 8 3/4" x 30", dims: ['8.75"', '30"', "50'-0\""],
       profile: {params: {XDim: '8.75"', YDim: '30"'}}}

- key: lumber_ijoist
  label: Wood I-Joist
  ifc_class: IfcBeamType
  predefined: JOIST
  category: Engineered Lumber
  discipline: structural
  pack: structural-timber
  builder: profile
  tier: L300
  classification: {uniclass: Pr_20_76_88}         # Timber sections
  material: {name: OSB Web with LVL Flanges, category: wood}
  profile: {kind: IShape}
  types:                                           # real I-section, not a rectangle
    - name: 9 1/2" depth
      dims: ['2.5"', '9.5"', "16'-0\""]
      profile: {params: {OverallWidth: '2.5"', OverallDepth: '9.5"', WebThickness: '3/8"',
                         FlangeThickness: '1.375"'}}
    - name: 11 7/8" depth
      dims: ['2.5"', '11.875"', "18'-0\""]
      profile: {params: {OverallWidth: '2.5"', OverallDepth: '11.875"', WebThickness: '3/8"',
                         FlangeThickness: '1.375"'}}
    - name: 14" depth
      dims: ['2.5"', '14"', "20'-0\""]
      profile: {params: {OverallWidth: '2.5"', OverallDepth: '14"', WebThickness: '3/8"',
                         FlangeThickness: '1.375"'}}
    - name: 16" depth
      dims: ['3.5"', '16"', "24'-0\""]
      profile: {params: {OverallWidth: '3.5"', OverallDepth: '16"', WebThickness: '7/16"',
                         FlangeThickness: '1.5"'}}

- key: clt_panel
  label: Cross-Laminated Timber Panel
  ifc_class: IfcPlateType
  category: Mass Timber
  discipline: structural
  pack: structural-timber
  builder: profile
  tier: L300
  classification: {uniclass: Pr_20_76_88}         # Timber sections
  material: {name: CLT Spruce-Pine-Fir, category: wood}

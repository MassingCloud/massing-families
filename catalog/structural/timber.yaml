# Timber framing — dimensional lumber, engineered lumber, glulam, CLT.
#
# ⚠ NOMINAL IS NOT ACTUAL. A "2x4" is 1 1/2" x 3 1/2" dressed (S4S). The catalog *names* the nominal
# size, because that is what a framing plan calls out, and the *geometry* uses the actual dressed
# dimension — otherwise every wall is 1/2" too thick. This is exactly the nominal-vs-actual trap
# described in PLAN.md §8c.

- key: lumber_dimensional
  label: Dimensional Lumber
  ifc_class: IfcMemberType
  category: Framing
  discipline: structural
  pack: structural-timber
  builder: profile
  tier: L300
  classification: {uniclass: Pr_20_76_88}         # Timber sections
  material: {name: Douglas Fir-Larch No. 2, category: wood}
  psets:
    MF_Structural: {Species: Douglas Fir-Larch, Grade: No. 2, Surfacing: S4S}
  profile: {kind: Rectangle}
  types:                                           # name = nominal, geometry = actual dressed
    - {name: 2x4, dims: ['1.5"', '3.5"', "10'-0\""], profile: {params: {XDim: '1.5"', YDim: '3.5"'}}}
    - {name: 2x6, dims: ['1.5"', '5.5"', "10'-0\""], profile: {params: {XDim: '1.5"', YDim: '5.5"'}}}
    - {name: 2x8, dims: ['1.5"', '7.25"', "12'-0\""], profile: {params: {XDim: '1.5"', YDim: '7.25"'}}}
    - {name: 2x10, dims: ['1.5"', '9.25"', "14'-0\""], profile: {params: {XDim: '1.5"', YDim: '9.25"'}}}
    - {name: 2x12, dims: ['1.5"', '11.25"', "16'-0\""], profile: {params: {XDim: '1.5"', YDim: '11.25"'}}}
    - {name: 4x4, dims: ['3.5"', '3.5"', "10'-0\""], profile: {params: {XDim: '3.5"', YDim: '3.5"'}}}
    - {name: 4x6, dims: ['3.5"', '5.5"', "10'-0\""], profile: {params: {XDim: '3.5"', YDim: '5.5"'}}}
    - {name: 6x6, dims: ['5.5"', '5.5"', "10'-0\""], profile: {params: {XDim: '5.5"', YDim: '5.5"'}}}
    - {name: 6x8, dims: ['5.5"', '7.25"', "12'-0\""], profile: {params: {XDim: '5.5"', YDim: '7.25"'}}}

- key: lumber_stud
  label: Wall Stud
  ifc_class: IfcMemberType
  predefined: STUD
  category: Framing
  discipline: structural
  pack: structural-timber
  builder: profile
  tier: L300
  classification: {uniclass: Pr_20_76_88}         # Timber sections
  material: {name: Spruce-Pine-Fir Stud Grade, category: wood}
  profile: {kind: Rectangle}
  types:                                           # 92 5/8" precut gives an 8'-1 1/8" wall
    - {name: 2x4 92 5/8" precut, dims: ['1.5"', '3.5"', '92 5/8"'],
       profile: {params: {XDim: '1.5"', YDim: '3.5"'}}}
    - {name: 2x6 92 5/8" precut, dims: ['1.5"', '5.5"', '92 5/8"'],
       profile: {params: {XDim: '1.5"', YDim: '5.5"'}}}
    - {name: 2x4 104 5/8" precut, dims: ['1.5"', '3.5"', '104 5/8"'],
       profile: {params: {XDim: '1.5"', YDim: '3.5"'}}}


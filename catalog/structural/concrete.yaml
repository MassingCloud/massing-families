# Cast-in-place reinforced concrete framing — US imperial nominal sizes.
# Uniclass Ss (Systems) codes verified against the published Ss table: cast-in-place concrete framing
# is a system, not a catalogue product, so Ss is the correct table here.

- key: concrete_column
  label: Concrete Column
  massing_key: concrete_column
  ifc_class: IfcColumnType
  predefined: COLUMN
  category: Columns
  discipline: structural
  pack: structural-concrete
  builder: profile
  tier: L300
  classification: {uniclass: Ss_20_30_75}         # Structural column systems
  material: {name: 4000 psi Normal Weight Concrete, category: concrete}
  psets:
    Pset_ColumnCommon: {LoadBearing: true, IsExternal: false}
    MF_Structural: {CompressiveStrength: 4000 psi, ReinforcementGrade: ASTM A615 Gr 60}
  profile: {kind: Rectangle}
  types:
    - {name: 12" x 12", dims: ['12"', '12"', "12'-0\""], profile: {params: {XDim: '12"', YDim: '12"'}}}
    - {name: 16" x 16", dims: ['16"', '16"', "12'-0\""], profile: {params: {XDim: '16"', YDim: '16"'}}}
    - {name: 18" x 18", dims: ['18"', '18"', "12'-0\""], profile: {params: {XDim: '18"', YDim: '18"'}}}
    - {name: 24" x 24", dims: ['24"', '24"', "12'-0\""], profile: {params: {XDim: '24"', YDim: '24"'}}}


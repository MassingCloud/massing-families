# Foundations — the gap the typology-coverage check found (FAMILY-COMPLETE batch 6c).
#
# The structural catalog carried 39 families of superstructure — W-shapes, HSS, tees, channels,
# concrete frames, precast, timber, rebar, PT — and not one foundation. `steel_pile_hp` is an HP
# *section*, not a foundation element. So every one of the six target typologies was unbuildable for
# the same reason, and it took a mechanical coverage check to notice: the catalog looked enormous,
# and it could not hold a building up.
#
# That is the value of asserting on IFC classes rather than on family counts. 413 families across 56
# packs still reported zero `IfcFootingType`, and no amount of breadth elsewhere substitutes.
#
# Sizes are massing-grade and generic on purpose — a real footing comes from a geotechnical report
# and a reaction, neither of which a content library has. What matters here is that the ELEMENT can
# be placed, scheduled and taken off; the engineer resizes it.

- key: footing_spread
  label: Spread / Pad Footing
  ifc_class: IfcFootingType
  predefined: PAD_FOOTING
  category: Foundations
  discipline: structural
  pack: structural-foundations
  builder: box
  tier: L200
  material: {name: Cast-in-Place Concrete, category: concrete}
  psets:
    Pset_FootingCommon: {LoadBearing: "true"}
    MF_Structural: {Concrete: 4000 psi, Reinforcement: Bottom mat each way,
                    Note: Size comes from the bearing capacity in the geotechnical report}
  types:
    - {name: '3''-0" x 3''-0" x 12"', dims: ['3''-0"', '3''-0"', '1''-0"']}
    - {name: '4''-0" x 4''-0" x 12"', dims: ['4''-0"', '4''-0"', '1''-0"']}
    - {name: '5''-0" x 5''-0" x 15"', dims: ['5''-0"', '5''-0"', '1''-3"']}
    - {name: '6''-0" x 6''-0" x 18"', dims: ['6''-0"', '6''-0"', '1''-6"']}
    - {name: '8''-0" x 8''-0" x 24"', dims: ['8''-0"', '8''-0"', '2''-0"']}
    - {name: '10''-0" x 10''-0" x 30"', dims: ['10''-0"', '10''-0"', '2''-6"']}
    - {name: '12''-0" x 12''-0" x 36"', dims: ['12''-0"', '12''-0"', '3''-0"']}


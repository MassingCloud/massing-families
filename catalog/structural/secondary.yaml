# Secondary structure — precast concrete, steel joists, metal deck, plates and fasteners.
#
# Double-tees use the `assembly` builder (flange + two stems as positioned solids) because a
# double-tee modelled as a box is unusable for coordination — the space between the stems is where
# the MEP goes.

- key: precast_double_tee
  label: Precast Double Tee
  ifc_class: IfcSlabType
  predefined: FLOOR
  category: Precast
  discipline: structural
  pack: structural-precast
  builder: assembly
  tier: L350
  classification: {uniclass: Pr_20_85_14}         # Concrete flooring and decking products
  material: {name: 5000 psi Precast Concrete, category: concrete}
  psets:
    Pset_SlabCommon: {LoadBearing: true, IsExternal: false}
    MF_Structural: {Product: Precast prestressed double tee}
  types:
    - name: 8DT24 (8'-0" x 24")
      dims: ["8'-0\"", '24"', "60'-0\""]
      assembly:
        parts:
          - {kind: Rectangle, params: {XDim: "8'-0\"", YDim: '4"'}, depth: "60'-0\"",
             at: [0, 0, 0], name: Flange}
          - {kind: Rectangle, params: {XDim: '6"', YDim: '20"'}, depth: "60'-0\"",
             at: ['-24"', '12"', 0], name: Stem 1}
          - {kind: Rectangle, params: {XDim: '6"', YDim: '20"'}, depth: "60'-0\"",
             at: ['24"', '12"', 0], name: Stem 2}
    - name: 10DT32 (10'-0" x 32")
      dims: ["10'-0\"", '32"', "70'-0\""]
      assembly:
        parts:
          - {kind: Rectangle, params: {XDim: "10'-0\"", YDim: '4"'}, depth: "70'-0\"",
             at: [0, 0, 0], name: Flange}
          - {kind: Rectangle, params: {XDim: '7"', YDim: '28"'}, depth: "70'-0\"",
             at: ['-30"', '16"', 0], name: Stem 1}
          - {kind: Rectangle, params: {XDim: '7"', YDim: '28"'}, depth: "70'-0\"",
             at: ['30"', '16"', 0], name: Stem 2}


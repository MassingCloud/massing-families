- key: steel_joist
  label: Open Web Steel Joist
  ifc_class: IfcBeamType
  predefined: JOIST
  category: Joists
  discipline: structural
  pack: structural-secondary
  builder: assembly
  tier: L350
  classification: {uniclass: Pr_20_85_90_11}      # Carbon steel lattice floor joists and purlins
  material: {name: ASTM A36 / A992 Steel, category: steel}
  psets:
    MF_Structural: {Product: Open web steel joist, Specification: SJI K-series}
  types:                                           # chords modelled; web members are schematic
    - name: 18K4 (18" depth)
      dims: ['2.5"', '18"', "30'-0\""]
      assembly:
        parts:
          - {kind: Rectangle, params: {XDim: '2.5"', YDim: '1.5"'}, depth: "30'-0\"",
             at: [0, 0, 0], name: Bottom chord}
          - {kind: Rectangle, params: {XDim: '2.5"', YDim: '1.5"'}, depth: "30'-0\"",
             at: [0, '16.5"', 0], name: Top chord}
    - name: 24K9 (24" depth)
      dims: ['3"', '24"', "40'-0\""]
      assembly:
        parts:
          - {kind: Rectangle, params: {XDim: '3"', YDim: '2"'}, depth: "40'-0\"",
             at: [0, 0, 0], name: Bottom chord}
          - {kind: Rectangle, params: {XDim: '3"', YDim: '2"'}, depth: "40'-0\"",
             at: [0, '22"', 0], name: Top chord}


# Furniture — US imperial nominal sizes.
# Uniclass codes verified against the published Pr table (Uniclass2015_Pr.csv).
# `massing_key` maps each family to massing's built-in CATALOG entry so a pack can eventually
# replace that entry upstream (PLAN.md §10 Phase 1).

- key: desk
  label: Desk
  massing_key: desk
  ifc_class: IfcFurnitureType
  predefined: DESK
  category: Furniture
  discipline: interiors
  builder: box
  tier: L200
  classification: {uniclass: Pr_40_50_21_21}      # Desks
  material: {name: Laminate / Steel, category: composite}
  types:
    - {name: '48" x 24"', dims: ["4'-0\"", "2'-0\"", '29"']}
    - {name: '60" x 30"', dims: ["5'-0\"", "2'-6\"", '29"']}
    - {name: '72" x 36"', dims: ["6'-0\"", "3'-0\"", '29"']}


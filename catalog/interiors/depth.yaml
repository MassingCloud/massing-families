# Interiors depth — furniture that carries a programme (FAMILY-COMPLETE batch 5b).
#
# The base interiors catalog (17 families) is a generic office/residential kit: chair, desk, table,
# bed, sofa, workstation, casework, appliances. It furnishes an apartment and an open-plan floor
# and nothing else. The six target typologies each fail on it for the same reason — furniture is
# where the PROGRAMME becomes visible. A hospital plan without a patient bed, headwall and exam
# table isn't a hospital plan; an airport without gate seating and a check-in counter isn't one.
#
# These are massing-grade blocks at real clearance dimensions. Their value in a model is the
# footprint, the circulation they force, and the count that lands in an FF&E schedule — not joinery.

# ─────────────────────────── workplace ───────────────────────────
- key: reception_desk
  label: Reception Desk
  ifc_class: IfcFurnitureType
  predefined: DESK
  category: Furniture
  discipline: interiors
  classification: {uniclass: Pr_40_50_21}           # Desks and tables
  pack: interiors-furniture
  builder: box
  tier: L200
  material: {name: Solid Surface / Wood, category: composite}
  psets:
    MF_FFE: {ADATransactionCounter: "true"}
  types:
    - {name: 'Straight 8''-0"', dims: ['8''-0"', '2''-6"', '3''-6"']}
    - {name: 'L-Shaped 10'' x 6''', dims: ['10''-0"', '6''-0"', '3''-6"']}

# Sitework — paving, curbs, fencing, bollards, site drainage, lighting, site furnishings.
# Uniclass codes verified against the published Pr/Ss tables.

- key: paving_asphalt
  label: Asphalt Paving
  ifc_class: IfcSlabType
  predefined: BASESLAB
  category: Paving
  discipline: site
  pack: site-civil
  builder: box
  tier: L200
  classification: {uniclass: Ss_30_14}            # Paving systems
  material:
    name: Asphalt Paving Section
    layers:
      - {material: Asphalt Wearing Course, thickness: '1 1/2"', category: bitumen}
      - {material: Asphalt Binder Course, thickness: '2 1/2"', category: bitumen}
      - {material: Aggregate Base, thickness: '8"', category: aggregate}
  types:
    - {name: Light duty (parking), dims: ["20'-0\"", "20'-0\"", '10"']}
    - {name: Heavy duty (drive aisle), dims: ["20'-0\"", "20'-0\"", '14"']}

- key: paving_concrete

  pack: site-civil
  builder: profile
  tier: L300
  classification: {uniclass: Pr_20_76_08}         # Bollards and impact protectors
  material: {name: Concrete-Filled Steel Pipe, category: steel}
  profile: {kind: CircleHollow}
  types:
    - name: 6" dia fixed
      dims: ['6.625"', '6.625"', "3'-6\""]
      profile: {params: {Radius: 3.3125, WallThickness: 0.28}}
    - name: 8" dia fixed
      dims: ['8.625"', '8.625"', "4'-0\""]
      profile: {params: {Radius: 4.3125, WallThickness: 0.322}}


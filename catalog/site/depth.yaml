# Site depth — the utilities and site elements a permit set needs (FAMILY-COMPLETE batch 6b).
#
# The base site catalog covers landscape and paving well and utilities barely: a catch basin, a
# manhole and a trench drain, with no pipe between them. A civil sheet is mostly pipe — storm,
# sanitary, domestic water and fire service — plus the appurtenances that make each run legal
# (hydrant, valve box, cleanout, backflow vault).
#
# The rest is what every one of the six typologies actually needs on a site plan and none of them
# can draw today: the transformer and generator pads that serve the building, the accessible
# parking layout, the loading and refuse enclosures, and the site signage that carries the code.

# ─────────────────────────── site utilities ───────────────────────────
- key: pipe_storm
  label: Storm Drainage Pipe
  ifc_class: IfcPipeSegmentType
  predefined: RIGIDSEGMENT
  category: Site Utilities
  discipline: site
  classification: {uniclass: Pr_65_52_07}           # Below-ground and pressure drainage pipes and fittings
  pack: site-utilities
  builder: profile
  tier: L300
  material: {name: Reinforced Concrete, category: concrete}
  ports: {system: PIPE, names: [In, Out], flows: [SINK, SOURCE]}
  psets:
    MF_SiteUtilities: {Standard: ASTM C76, Class: III, Service: Storm}
  generator: sizes
  generator_args:
    kind: CircleHollow
    length: "8'-0\""
    name: '{nominal} RCP Storm'
    entries:
      - {nominal: '12"', od: 15.0, wall: 1.75}
      - {nominal: '18"', od: 22.0, wall: 2.0}
      - {nominal: '24"', od: 29.0, wall: 2.5}
      - {nominal: '36"', od: 43.0, wall: 3.5}
      - {nominal: '48"', od: 57.0, wall: 4.5}

